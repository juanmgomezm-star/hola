<div class="container" style="max-width: 600px;">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
    <h2>Agencia de Vuelos</h2>
    <button (click)="logout()" style="width: auto; padding: 0.5rem 1rem; margin: 0; background: var(--error);">Salir</button>
  </div>
  <p class="subtitle">Reserva tu próximo destino</p>

  <div *ngIf="successMessage" class="success-message">
    {{ successMessage }}
  </div>

  <div *ngIf="errorMessage" class="error-message" style="text-align: center; margin-bottom: 1rem;">
    {{ errorMessage }}
  </div>

  <form (ngSubmit)="bookFlight()">
    <div class="form-group">
      <input type="text" id="origin" name="origin" [(ngModel)]="flight.origin" required placeholder=" ">
      <label for="origin">Origen</label>
    </div>

    <div class="form-group">
      <input type="text" id="destination" name="destination" [(ngModel)]="flight.destination" required placeholder=" ">
      <label for="destination">Destino</label>
    </div>

    <div style="display: flex; gap: 1rem;">
      <div class="form-group" style="flex: 1;">
        <input type="date" id="departure" name="departure_date" [(ngModel)]="flight.departure_date" required placeholder=" ">
        <label for="departure">Fecha de Ida</label>
      </div>

      <div class="form-group" style="flex: 1;">
        <input type="date" id="return" name="return_date" [(ngModel)]="flight.return_date" required placeholder=" ">
        <label for="return">Fecha de Vuelta</label>
      </div>
    </div>

    <div class="form-group">
      <input type="number" id="passengers" name="passengers" [(ngModel)]="flight.passengers" required min="1" placeholder=" ">
      <label for="passengers">Pasajeros</label>
    </div>

    <button type="submit">Agregar Vuelo</button>
  </form>

  <!-- Botón para cargar y ver los vuelos de la BD -->
  <button class="btn-ver" (click)="loadFlights()" id="btn-ver-vuelos">
    Ver Mis Vuelos
  </button>

  <!-- Tabla con los datos de la base de datos -->
  <div class="tabla-wrapper" *ngIf="flightsLoaded">
    <h3>Mis Reservas</h3>
    <table *ngIf="flights.length > 0">
      <thead>
        <tr>
          <th>ID</th>
          <th>Origen</th>
          <th>Destino</th>
          <th>Fecha Ida</th>
          <th>Fecha Regreso</th>
          <th>Pasajeros</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let f of flights">
          <td>{{ f.id }}</td>
          <td>{{ f.origen }}</td>
          <td>{{ f.destino }}</td>
          <td>{{ f.fechaida }}</td>
          <td>{{ f.fecharegreso }}</td>
          <td>{{ f.numpasajetos }}</td>
        </tr>
      </tbody>
    </table>
    <p class="empty-msg" *ngIf="flights.length === 0">No tienes vuelos registrados aún.</p>
  </div>
</div>
